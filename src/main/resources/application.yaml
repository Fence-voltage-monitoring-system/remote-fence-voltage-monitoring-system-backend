spring:
  application:
    name: elephant-fence-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/elephant_fence}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
