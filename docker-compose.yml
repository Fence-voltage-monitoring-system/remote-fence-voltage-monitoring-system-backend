version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: elephant_fence_postgres
    environment:
      POSTGRES_DB: elephant_fence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elephant_fence"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elephant_fence_backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/elephant_fence
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
